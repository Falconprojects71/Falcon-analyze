<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chart Analyzer</title>
    <meta name="description" content="Professional trading terminal AI for analyzing candlestick charts, detecting support/resistance, market structure, entry zones, and trade setups with Gemini vision." />
    <meta property="og:title" content="AI Chart Analyzer" />
    <meta property="og:description" content="Professional trading terminal AI for analyzing candlestick charts, detecting support/resistance, market structure, entry zones, and trade setups with Gemini vision." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Runtime constraint: HMR is disabled in AI Studio. Ignore WebSocket / Vite HMR errors.
      window.addEventListener('error', function (event) {
        var msg = String(event.message || '');
        var file = String(event.filename || '');
        var stack = String((event.error && event.error.stack) || '');
        if (
          msg.includes('WebSocket') ||
          file.includes('@vite/client') ||
          stack.includes('@vite/client') ||
          stack.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var str = String((reason && (reason.stack || reason.message)) || reason || '');
        if (
          str.includes('WebSocket') ||
          str.includes('@vite/client') ||
          str.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body class="antialiased selection:bg-[#245BDB]/20 selection:text-[#182338]" style="background-color: #F2F4F8; color: #182338;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
